name: Deploy to Aliyun

on:
  push:
    branches:
      - main

jobs:
  code-quality:
    runs-on: ubuntu-latest
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js with pnpm
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.2

      - name: 📦 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗂️ Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 📦 Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: 🔍 ESLint Check
        run: |
          cd frontend
          echo "Running ESLint..."
          pnpm run lint

      - name: 🔎 TypeScript Type Check
        run: |
          cd frontend
          echo "Running TypeScript type check..."
          pnpm run type-check

      - name: ✅ Quality Check Passed
        run: echo "All quality checks passed! Proceeding with deployment..."

  build-frontend:
    runs-on: ubuntu-latest
    needs: code-quality
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v5

      - name: 🟢 Setup Node.js with pnpm
        uses: actions/setup-node@v5
        with:
          node-version-file: frontend/.nvmrc

      - name: 📦 Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.2

      - name: 📦 Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: 🗂️ Setup pnpm cache
        uses: actions/cache@v5
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('frontend/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: 🐧 Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          echo "SSH_KEY_PATH=$HOME/.ssh/aliyun_deploy_key" >> "$GITHUB_ENV"

      - name: 🧾 Prepare frontend build env
        env:
          ADMIN_FRONTEND_ENV: ${{ secrets.ADMIN_FRONTEND_ENV }}
        run: |
          if [ -n "$ADMIN_FRONTEND_ENV" ]; then
            printf "%s\n" "$ADMIN_FRONTEND_ENV" > frontend/.env.production
          else
            scp -o StrictHostKeyChecking=no \
              -i "$SSH_KEY_PATH" \
              ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}:/var/www/env/admin.frontend.env \
              frontend/.env.production
          fi

      - name: 📦 Install dependencies
        run: cd frontend && pnpm install --frozen-lockfile

      - name: 🏗️ Build frontend
        run: cd frontend && pnpm run build

      - name: 🧹 Remove env files from standalone artifact
        run: rm -f frontend/.next/standalone/.env*

      - name: 📦 Package frontend artifact
        run: |
          tar -czf frontend-build.tar.gz \
            -C frontend \
            .next/standalone \
            .next/static \
            public \
            Dockerfile \
            .dockerignore

      - name: ⬆️ Upload frontend artifact
        uses: actions/upload-artifact@v7
        with:
          name: frontend-build
          path: frontend-build.tar.gz
          if-no-files-found: error

  project-prepare:
    runs-on: ubuntu-latest
    needs: build-frontend
    steps:
      - name: 🛎️ Checkout code
        uses: actions/checkout@v5

      - name: ⬇️ Download frontend artifact
        uses: actions/download-artifact@v7
        with:
          name: frontend-build
          path: .deploy

      - name: 📦 Unpack frontend artifact
        run: |
          mkdir -p .deploy/frontend
          tar -xzf .deploy/frontend-build.tar.gz -C .deploy/frontend

      - name: 🐧 Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          echo "SSH_KEY_PATH=$HOME/.ssh/aliyun_deploy_key" >> "$GITHUB_ENV"

      - name: 📤 Copy project files to Aliyun
        run: |
          rsync -avz --delete \
            --exclude ".git/" \
            --exclude ".deploy/" \
            --exclude "frontend/" \
            -e "ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no" \
            ./ ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}:/var/www/website-admin

      - name: 📤 Copy frontend build artifact to Aliyun
        run: |
          rsync -avz --delete \
            --exclude ".env" \
            --exclude ".env.production" \
            -e "ssh -i $SSH_KEY_PATH -o StrictHostKeyChecking=no" \
            .deploy/frontend/ ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }}:/var/www/website-admin/frontend/

      - name: 🧾 Prepare .env files
        run: |
          ssh -i "$SSH_KEY_PATH" -o StrictHostKeyChecking=no ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }} << 'EOF'
            cp /var/www/env/admin.env /var/www/website-admin/backend/.env
            cp /var/www/env/admin.env /var/www/website-admin/backend/.env.production
            cp /var/www/env/admin.frontend.env /var/www/website-admin/frontend/.env 
            cp /var/www/env/admin.frontend.env /var/www/website-admin/frontend/.env.production 
          EOF

  deploy-backend:
    runs-on: ubuntu-latest
    needs: project-prepare
    steps:
      - name: 🐧 Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          echo "SSH_KEY_PATH=$HOME/.ssh/aliyun_deploy_key" >> "$GITHUB_ENV"

      - name: 🐳 Deploy Backend
        run: |
          ssh -i "$SSH_KEY_PATH" -o StrictHostKeyChecking=no ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }} << 'EOF'
            echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login ${{ secrets.ALIYUN_REGISTRY_SERVER }} \
              -u ${{ secrets.ALIYUN_REGISTRY_USERNAME }} --password-stdin
            
            cd /var/www/website-admin
            
            sudo docker compose stop backend || true
            sudo docker compose rm -f backend || true
            sudo docker compose build backend
            sudo docker compose up -d backend
            
            sleep 5
            sudo docker compose exec -T backend python manage.py migrate
            
            echo "✅ Backend deployed!"
          EOF

  deploy-frontend:
    runs-on: ubuntu-latest
    needs: [project-prepare, deploy-backend]
    steps:
      - name: 🐧 Prepare SSH key
        run: |
          mkdir -p ~/.ssh
          printf "%s\n" "${{ secrets.ALIYUN_SSH_PRIVATE_KEY }}" > ~/.ssh/aliyun_deploy_key
          chmod 600 ~/.ssh/aliyun_deploy_key
          echo "SSH_KEY_PATH=$HOME/.ssh/aliyun_deploy_key" >> "$GITHUB_ENV"

      - name: 🐳 Deploy Frontend
        run: |
          ssh -o StrictHostKeyChecking=no \
              -i "$SSH_KEY_PATH" \
              -o ServerAliveInterval=60 \
              -o ServerAliveCountMax=6000 \
              -o TCPKeepAlive=yes \
              ${{ secrets.ALIYUN_USER }}@${{ secrets.ALIYUN_HOST }} << 'EOF'
            set -e
            
            echo "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}" | docker login ${{ secrets.ALIYUN_REGISTRY_SERVER }} \
              -u ${{ secrets.ALIYUN_REGISTRY_USERNAME }} --password-stdin
            
            cd /var/www/website-admin
            
            sudo docker compose stop frontend || true
            sudo docker compose rm -f frontend || true
            
            DOCKER_BUILDKIT=1 sudo docker compose build frontend
            sudo docker compose up -d frontend
            
            sleep 10
            echo "✅ Frontend deployed!"
          EOF
